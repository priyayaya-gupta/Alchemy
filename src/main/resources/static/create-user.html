<!DOCTYPE html>
<html>

<head>
    <title>Alchemy - Admin Dashboard</title>
    <link rel="icon" href="data:,">
</head>

<body>

    <h2>Admin Dashboard</h2>

    <p id="adminName"></p>

    <button onclick="backToChatbot()">Back to Chatbot</button>
    <button onclick="logout()">Logout</button>

    <hr>

    <h3>Create New User</h3>

    <input id="name" type="text" placeholder="Name">
    <br><br>

    <input id="email" type="email" placeholder="Email">
    <br><br>

    <input id="password" type="password" placeholder="Password">
    <br><br>

    <label>Select Role</label>
    <br>

    <select id="role">
        <option value="USER">USER</option>
        <option value="ADMIN">ADMIN</option>
    </select>

    <br><br>

    <button onclick="createUser()">Create User</button>

    <p id="message"></p>

    <script>
        // CHANGED (Cookie Migration):
        // Pehle: token localStorage se nikala jata tha
        // Ab:    Token ab HttpOnly cookie me hai — JavaScript read nahi kar sakta
        //        Token localStorage se hataya — backend cookie se authenticate karega

        // Sirf display ke liye naam aur role localStorage se lete hain
        const role = localStorage.getItem("alchemyRole");
        const name = localStorage.getItem("alchemyName");

        // Soft frontend check — sirf UI ke liye convenience redirect
        // NOTE: Yeh check bypass kiya ja sakta hai (localStorage edit karke).
        //       REAL security backend me hai:
        //       SecurityConfig me /api/admin/** sirf ADMIN role allow karta hai.
        //       Agar USER yahan aakar bhi createUser() call kare, backend 403 dega.
        if (role !== "ADMIN") {
            alert("Only admin can access this page.");
            window.location.href = "/index.html";
        }

        window.addEventListener("DOMContentLoaded", function () {
            const adminName = document.getElementById("adminName");

            if (adminName && name) {
                adminName.innerText = "Hi, " + name;
            }
        });

        function backToChatbot() {
            window.location.href = "/index.html";
        }

        // CHANGED (Cookie Migration):
        // Pehle: Sirf localStorage clear hota tha
        // Ab:    Backend ko logout call karo taaki HttpOnly cookie expire ho
        async function logout() {
            try {
                // Backend logout endpoint — HttpOnly cookie expire karta hai
                // credentials: "include" zaroori hai taaki browser cookie bheje
                await fetch("/api/auth/logout", {
                    method: "POST",
                    credentials: "include"
                });
            } catch (error) {
                console.error("Logout API error:", error);
            }

            // Display data clear karo
            localStorage.removeItem("alchemyName");
            localStorage.removeItem("alchemyRole");

            window.location.href = "/login.html";
        }

        async function createUser() {
            const data = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value,
                role: document.getElementById("role").value
            };

            try {
                const response = await fetch("/api/admin/create-user", {
                    method: "POST",
                    headers: {
                        // JSON body ke liye Content-Type zaroori hai
                        "Content-Type": "application/json"
                        // REMOVED: "Authorization": "Bearer " + token
                        // Ab token ki zarurat nahi — browser HttpOnly cookie automatically attach karta hai
                    },
                    // credentials: "include": Browser "alchemyToken" cookie
                    // automatically request ke saath bhejega
                    // JavaScript token ko kabhi read nahi karega — cookie HttpOnly hai
                    credentials: "include",
                    body: JSON.stringify(data)
                });

                // 401/403: Cookie expire ho gayi ya role ADMIN nahi hai
                if (response.status === 401 || response.status === 403) {
                    alert("Session expired or unauthorized. Please login again.");
                    window.location.href = "/login.html";
                    return;
                }

                const result = await response.text();

                document.getElementById("message").innerText = result;

                if (result === "User created successfully") {
                    document.getElementById("name").value = "";
                    document.getElementById("email").value = "";
                    document.getElementById("password").value = "";
                    document.getElementById("role").value = "USER";
                }

            } catch (error) {
                document.getElementById("message").innerText =
                    "Something went wrong.";
            }
        }
    </script>

</body>

</html>
