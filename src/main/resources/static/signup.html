<!DOCTYPE html>
<html>

<head>
    <title>Alchemy Signup</title>
</head>

<body>

    <h2>Create Alchemy Account</h2>

    <input id="name" type="text" placeholder="Name"><br><br>
    <input id="email" type="email" placeholder="Email"><br><br>
    <input id="password" type="password" placeholder="Password"><br><br>

    <button onclick="signup()">Sign Up</button>

    <p id="message"></p>

    <p>
        Already have an account?
        <a href="/login.html">Login</a>
    </p>

    <script>
        async function signup() {
            const data = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            };

            const response = await fetch("/api/auth/signup", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            document.getElementById("message").innerText = result.message;

            // Signup ke baad token store nahi karenge.
            // User ko login page par bhejenge, phir login token save karega.
            if (result.message === "Signup successful" || result.token) {
                document.getElementById("message").innerText =
                    "Account created successfully! Redirecting to login...";

                setTimeout(() => {
                    window.location.href = "/login.html";
                }, 1500);
            }
        }
    </script>

</body>

</html>
